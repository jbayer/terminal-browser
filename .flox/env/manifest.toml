schema-version = "1.19.0"
# Generated by /floxify

[install]
# ← .github/workflows/release.yml (setup-node 22)
nodejs.pkg-path = "nodejs_22"
# ← package.json packageManager pnpm@10.13.1
# 2026-11-24: in the default group this exact pin held rustc at 1.88, but the
# engine's `wide` crate needs >=1.89; pnpm has no native coupling, so isolate it.
pnpm.pkg-path = "pnpm_10"
pnpm.version = "10.13.1"
pnpm.pkg-group = "pnpm"
# pixel/engine is a Rust 2024-edition workspace; CI uses stable
cargo.pkg-path = "cargo"
cargo.version = ">=1.89"
rustc.pkg-path = "rustc"
rustc.version = ">=1.89"

[vars]
COREPACK_ENABLE_STRICT = "0"

[hook]
on-activate = '''
  if ! command -v swiftc >/dev/null 2>&1; then
    echo "⚠  swiftc not found — install Xcode Command Line Tools: xcode-select --install" >&2
  fi

  stamp="$FLOX_ENV_CACHE/pnpm-lock.sha"
  current="$(shasum "$FLOX_ENV_PROJECT/pnpm-lock.yaml" | cut -d' ' -f1)"
  if [ ! -d "$FLOX_ENV_PROJECT/node_modules" ] || [ "$(cat "$stamp" 2>/dev/null)" != "$current" ]; then
    echo "Installing workspace dependencies (pnpm install)..." >&2
    (cd "$FLOX_ENV_PROJECT" && pnpm install --frozen-lockfile >&2) && echo "$current" > "$stamp"
  fi
'''

[options]
systems = ["aarch64-darwin", "aarch64-linux", "x86_64-linux"]
